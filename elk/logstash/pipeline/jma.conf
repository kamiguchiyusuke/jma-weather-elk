# 気象庁「過去の気象データ・ダウンロード」の日別値CSVを、Python で整形せずにそのまま
# Elasticsearch の jma-daily に入れる（1行 = 1地点 × 1日）
#
# 前提:
#   - 1ファイル = 1地点。ファイル名は jma_<都道府県>_<地点>_<開始年>-<終了年>.csv
#     （地点名は見出し行にしか無く、Logstash は1行ずつ処理するので、ファイル名から取る）
#   - 項目は「平均気温・最高気温・最低気温・降水量の合計」をこの順で、
#     「すべて数値で格納」「品質情報・均質番号・現象なし情報あり」でダウンロードしたもの
#     （項目や順番を変えたら下の csv の columns も直す）
input {
  file {
    path => "/data/raw/jma_*.csv"
    mode => "read"
    # read モードの既定は "delete"（読み終えたファイルを消す）なので必ず log にする
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    # 読んだ位置を残さない。再起動すると読み直すが document_id が同じなので重複しない
    sincedb_path => "/dev/null"
    # data/raw は download_jma.py が UTF-8 に変換済み。
    # ブラウザで落としたままの Shift_JIS のファイルなら "Windows-31J" にする
    codec => plain { charset => "UTF-8" }
  }
}

filter {
  # 見出しの6行（ダウンロード時刻・地域・地点・項目名・空行・品質情報など）を捨て、日付で始まる行だけ残す
  if [message] !~ /^\d{4}\/\d{1,2}\/\d{1,2},/ { drop {} }

  # 列名は見出しから取れない（同じ名前が何度も出てくる）ので、列の順番どおりに書く。
  # 降水量だけ「値, 現象なし情報, 品質情報, 均質番号」の順になっている
  csv {
    columns => [
      "date",
      "temp_avg", "temp_avg_quality", "temp_avg_homogeneity",
      "temp_max", "temp_max_quality", "temp_max_homogeneity",
      "temp_min", "temp_min_quality", "temp_min_homogeneity",
      "precip_total", "precip_total_nophenomenon", "precip_total_quality", "precip_total_homogeneity"
    ]
    skip_empty_columns => true
    convert => {
      "temp_avg" => "float"  "temp_max" => "float"  "temp_min" => "float"  "precip_total" => "float"
      "temp_avg_quality" => "integer"  "temp_max_quality" => "integer"
      "temp_min_quality" => "integer"  "precip_total_quality" => "integer"
      "temp_avg_homogeneity" => "integer"  "temp_max_homogeneity" => "integer"
      "temp_min_homogeneity" => "integer"  "precip_total_homogeneity" => "integer"
      "precip_total_nophenomenon" => "integer"
    }
  }

  # 都道府県と地点はファイル名から取る
  grok {
    match => { "[log][file][path]" => "jma_(?<prefecture>[^_/]+)_(?<station>[^_/]+)_\d+-\d+\.csv$" }
    tag_on_failure => ["_filename_parse_failure"]
  }

  # 日付はゼロ埋めなし（1986/1/1）。日本時間の 0 時として @timestamp にする
  date {
    match => ["date", "yyyy/M/d"]
    timezone => "Asia/Tokyo"
  }
  dissect {
    mapping => { "date" => "%{year}/%{month}/%{day}" }
    convert_datatype => { "year" => "int" "month" => "int" "day" => "int" }
  }

  # 品質情報が 5 未満（4=資料不足値, 2=疑問値, 1=欠測）の値は使わない（HTML ビューアと同じルール）
  if [temp_avg_quality] and [temp_avg_quality] < 5 { mutate { remove_field => ["temp_avg"] } }
  if [temp_max_quality] and [temp_max_quality] < 5 { mutate { remove_field => ["temp_max"] } }
  if [temp_min_quality] and [temp_min_quality] < 5 { mutate { remove_field => ["temp_min"] } }
  if [precip_total_quality] and [precip_total_quality] < 5 { mutate { remove_field => ["precip_total"] } }

  mutate { remove_field => ["message", "event", "log", "host", "@version"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "jma-daily"
    data_stream => false
    document_id => "%{station}-%{date}"
    manage_template => true
    template => "/usr/share/logstash/templates/jma-daily.json"
    template_name => "jma-daily"
    template_overwrite => true
  }
}
